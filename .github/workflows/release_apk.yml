name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Synchronize Web Assets to Android Project
        run: |
          mkdir -p android/app/src/main/assets
          cp -r android-app/* android/app/src/main/assets/
          echo "Assets web sincronizados en APK."

      - name: Build Android Release APK
        run: |
          cd android
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Prepare APK Asset
        id: prepare_apk
        run: |
          TAG_NAME="${GITHUB_REF_NAME:-v1.0.0}"
          APK_SRC=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_SRC" ]; then
            APK_SRC=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          fi
          APK_DEST="Antigravity-Mobile-Hub-${TAG_NAME}.apk"
          cp "$APK_SRC" "$APK_DEST"
          echo "apk_path=$APK_DEST" >> $GITHUB_OUTPUT
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
          ls -lh "$APK_DEST"

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "Antigravity Mobile Hub ${{ steps.prepare_apk.outputs.tag }}"
          files: ${{ steps.prepare_apk.outputs.apk_path }}
          draft: false
          prerelease: false
          body: |
            ## ⚡ Antigravity Mobile Hub ${{ steps.prepare_apk.outputs.tag }} — Wi-Fi Hub & Project Navigator Edition

            Aplicación Android de ingeniería agéntica conectada simultáneamente a **GitHub** (`zero-phoenix`), **Google Gemini 3.8 Flash High** y **Google Antigravity en la PC anfitriona** a través de Wi-Fi local.

            ### 📲 Descarga e Instalación
            - **Descarga el archivo adjunto**: [`${{ steps.prepare_apk.outputs.apk_path }}`](https://github.com/${{ github.repository }}/releases/download/${{ steps.prepare_apk.outputs.tag }}/${{ steps.prepare_apk.outputs.apk_path }})
            - En tu celular Android, abre el archivo descargado y presiona **Instalar** (permite "Instalar aplicaciones de fuentes desconocidas" si tu teléfono lo solicita).

            ---

            ### 🚀 Novedades de la Versión v2.3.0
            - **📶 Conexión Wi-Fi Autónoma (Cero Cables USB)**: Comunicación directa con el servidor Gateway de la PC (`192.168.18.113:8765`) en red local. Cero dependencia de túneles ADB o cable USB.
            - **📜 Historial Completo de Sesiones Antigravity**: Nueva pestaña **Chats** con acceso y lectura de las 113 conversaciones registradas en la PC, transcripciones detalladas de mensajes, razonamiento y código.
            - **📁 Navegador de Proyectos Locales en PC**: Nueva pestaña **Proyectos** con escaneo en vivo de 46 repositorios en Windows (`Documents/GitHub`, `ZCodeProject`, `antigravity`), ramas git, commits y cambio de proyecto activo al instante.
            - **🧠 Google Gemini 3.8 Flash High**: Motor `gemini-3.8-flash` con **Thinking Budget = 2048 (High)** integrado como motor exclusivo.
            - **🐙 GitHub Cloud Explorer (Zero-Download)**: Lectura e inspección en RAM sin descargar repositorios.
            - **💻 Terminal Remota PowerShell**: Control de línea de comandos en Windows en tiempo real desde el móvil.
