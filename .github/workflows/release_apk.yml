name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Synchronize Web Assets to Android Project
        run: |
          mkdir -p android/app/src/main/assets
          cp -r android-app/* android/app/src/main/assets/
          echo "Assets web sincronizados en APK."

      - name: Build Android Release APK
        run: |
          cd android
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Prepare APK Asset
        id: prepare_apk
        run: |
          TAG_NAME="${GITHUB_REF_NAME:-v1.0.0}"
          APK_SRC=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_SRC" ]; then
            APK_SRC=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          fi
          APK_DEST="Antigravity-Mobile-Hub-${TAG_NAME}.apk"
          cp "$APK_SRC" "$APK_DEST"
          echo "apk_path=$APK_DEST" >> $GITHUB_OUTPUT
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
          ls -lh "$APK_DEST"

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "Antigravity Mobile Hub ${{ steps.prepare_apk.outputs.tag }}"
          files: ${{ steps.prepare_apk.outputs.apk_path }}
          draft: false
          prerelease: false
          body: |
            ## ⚡ Antigravity Mobile Hub ${{ steps.prepare_apk.outputs.tag }} — Release Oficial para Android

            Aplicación Android de ingeniería agéntica conectada simultáneamente a **GitHub** (`zero-phoenix`), **Google Gemini 2.0** y **Google Antigravity en la PC**.

            ### 📲 Descarga e Instalación
            - **Descarga el archivo adjunto**: [`${{ steps.prepare_apk.outputs.apk_path }}`](https://github.com/${{ github.repository }}/releases/download/${{ steps.prepare_apk.outputs.tag }}/${{ steps.prepare_apk.outputs.apk_path }})
            - En tu celular Android, abre el archivo descargado y presiona **Instalar** (permite "Instalar aplicaciones de fuentes desconocidas" si tu teléfono lo solicita).

            ---

            ### 🚀 Novedades de la Versión v2.1.0
            - **🔑 Autenticación por Código de Aplicación (Cero API Keys)**: Olvídate de ingresar claves a mano. Inicia sesión con el **PIN de Emparejamiento de 6 dígitos** con tu PC o mediante **GitHub Device Code Flow**.
            - **⚡ Gemini 2.0 Flash Oficial (Ultra Rápido)**: Modelo insignia de Google con latencia ultrabaja (<400ms) y streaming token a token en tiempo real sin esperas.
            - **🌐 Cuentas Sincronizadas**: Detección y vinculación automática de tus cuentas activas de Google (`david.chavez.nge@gmail.com`) y GitHub (`@zero-phoenix`).
            - **🧠 Control de Modelos y Thinking Budget**: Soporte para `Gemini 2.0 Flash`, `Gemini 2.0 Flash Lite`, `Gemini 1.5 Flash` y `Gemini 1.5 Pro`.
            - **☁️ Explorador Universal de Repositorios (Zero-Download)**: Lectura y edición directa de archivos con commits en RAM sin gastar memoria física.
            - **💻 Terminal PowerShell Remota**: Ejecución de comandos en la PC con streaming en vivo.
            - **🛡️ Auditoría Popperiana Completa**: Validación empírica en hardware Samsung Galaxy físico con Android 16.
