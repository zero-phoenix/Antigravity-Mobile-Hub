name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Synchronize Web Assets to Android Project
        run: |
          mkdir -p android/app/src/main/assets
          cp -r android-app/* android/app/src/main/assets/
          echo "Assets web sincronizados en APK."

      - name: Build Android Release APK
        run: |
          cd android
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Prepare APK Asset
        id: prepare_apk
        run: |
          TAG_NAME="${GITHUB_REF_NAME:-v1.0.0}"
          APK_SRC=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_SRC" ]; then
            APK_SRC=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          fi
          APK_DEST="Antigravity-Mobile-Hub-${TAG_NAME}.apk"
          cp "$APK_SRC" "$APK_DEST"
          echo "apk_path=$APK_DEST" >> $GITHUB_OUTPUT
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
          ls -lh "$APK_DEST"

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "Antigravity Mobile Hub ${{ steps.prepare_apk.outputs.tag }}"
          files: ${{ steps.prepare_apk.outputs.apk_path }}
          draft: false
          prerelease: false
          body: |
            ## ⚡ Antigravity Mobile Hub ${{ steps.prepare_apk.outputs.tag }} — Gemini 3.8 Flash High Edition

            Aplicación Android de ingeniería agéntica conectada simultáneamente a **GitHub** (`zero-phoenix`), **Google Gemini 3.8 Flash High** y **Google Antigravity en la PC anfitriona**.

            ### 📲 Descarga e Instalación
            - **Descarga el archivo adjunto**: [`${{ steps.prepare_apk.outputs.apk_path }}`](https://github.com/${{ github.repository }}/releases/download/${{ steps.prepare_apk.outputs.tag }}/${{ steps.prepare_apk.outputs.apk_path }})
            - En tu celular Android, abre el archivo descargado y presiona **Instalar** (permite "Instalar aplicaciones de fuentes desconocidas" si tu teléfono lo solicita).

            ---

            ### 🚀 Novedades de la Versión v2.2.0
            - **🧠 Google Gemini 3.8 Flash High**: Activación del modelo `gemini-3.8-flash` con **Thinking Budget = 2048 (High)** como motor prioritario y exclusivo.
            - **🔑 API Key Oficial Integrada**: Conexión con el proyecto `918764510534` persistida en la PC sin requerir ingreso manual de claves en el celular.
            - **⚡ Streaming y Resiliencia**: Streaming token a token en tiempo real vía WebSocket y tolerancia automática ante picos de demanda del endpoint (503).
            - **🌐 Cuentas Sincronizadas**: Detección y vinculación automática de tus cuentas activas de Google (`david.chavez.nge@gmail.com`) y GitHub (`@zero-phoenix`).
            - **☁️ Explorador Universal de Repositorios (Zero-Download)**: Lectura directa de árboles, ramas y commits en RAM sin descargar repositorios.
            - **💻 Terminal PowerShell Remota**: Ejecución remota de comandos en Windows en tiempo real desde el móvil.
            - **🛡️ Auditoría Popperiana Completa**: Verificado en dispositivo físico Samsung Galaxy A07 (Android 16, API 36).
