name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Synchronize Web Assets to Android Project
        run: |
          mkdir -p android/app/src/main/assets
          cp -r android-app/* android/app/src/main/assets/
          echo "Assets web sincronizados en APK."

      - name: Build Android Release APK
        run: |
          cd android
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Prepare APK Asset
        id: prepare_apk
        run: |
          TAG_NAME="${GITHUB_REF_NAME:-v1.0.0}"
          APK_SRC=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_SRC" ]; then
            APK_SRC=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          fi
          APK_DEST="Antigravity-Mobile-Hub-${TAG_NAME}.apk"
          cp "$APK_SRC" "$APK_DEST"
          echo "apk_path=$APK_DEST" >> $GITHUB_OUTPUT
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
          ls -lh "$APK_DEST"

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "Antigravity Mobile Hub ${{ steps.prepare_apk.outputs.tag }}"
          files: ${{ steps.prepare_apk.outputs.apk_path }}
          draft: false
          prerelease: false
          body: |
            ## ⚡ Antigravity Mobile Hub ${{ steps.prepare_apk.outputs.tag }} — MAGI-Orchestra System Edition

            Sistema de ingeniería móvil y de escritorio con la filosofía dialéctica de **[zero-phoenix/Magisys](https://github.com/zero-phoenix/Magisys)**, orquestado centralmente por **Google Gemini 3.8 Flash High** dirigiendo a **Claude Code CLI**, **ChatGPT / Codex CLI** y **ZCode** para ejecutar la máxima cantidad de proyectos en la PC anfitriona con máxima eficiencia de tokens (10x Token Yield).

            ### 📲 Descarga e Instalación
            - **Descarga el archivo adjunto**: [`${{ steps.prepare_apk.outputs.apk_path }}`](https://github.com/${{ github.repository }}/releases/download/${{ steps.prepare_apk.outputs.tag }}/${{ steps.prepare_apk.outputs.apk_path }})
            - En tu celular Android, abre el archivo descargado y presiona **Instalar** (permite "Instalar aplicaciones de fuentes desconocidas" si tu teléfono lo solicita).

            ---

            ### 🚀 Novedades de la Versión v3.0.0
            - **🏛️ Cockpit Dialéctico MAGI (Modo Orquesta)**:
              - **Naoko Dispatcher (Gemini 3.8 Flash High)**: Desglose de metas y asignación automática del DAG de tareas según fortalezas y costes de cada modelo.
              - **Melchior (Tesis)**: Construcción técnica y generación de código mediante ChatGPT/Codex o Claude Code.
              - **Balthasar (Antítesis Popperiana)**: Pruebas empíricas reales en Windows (*"una afirmación sin evidencia verificada no es una afirmación"*).
              - **Casper (Síntesis)**: Consolidación del parche definitivo y confirmación en Git.
              - **Ritsuko (Auditoría Sentinel)**: Supervisión de salud de directores, cortacircuitos y auditoría de tokens.
            - **👤 Modo Individual (Laboratorio Solo)**:
              - Switcher táctil en barra superior para chatear 1 a 1 de forma directa con: `[⚡ Gemini 3.8 Flash]`, `[🧠 Claude Code CLI]`, `[🤖 Codex/ChatGPT]` y `[🏛️ ZCode Desktop]`.
            - **📊 Optimización Extrema de Tokens (10x Token Yield)**:
              - Context Caching nativo de Google Gemini para especificaciones estáticas.
              - Compresión semántica de salidas de consola: reduce salidas masivas de 5,000 líneas a ~30 líneas de errores clave (ahorro del 95%).
              - Payloads Delta A2A estructurados en JSON entre agentes.
              - Indicador flotante en cabecera con contador de tokens y porcentaje de ahorro en vivo.
            - **📂 Matriz de Proyectos & Lanzamiento en 1 Toque**:
              - Selector de 46 repositorios de la PC conectado directamente a la orquesta con botón *🚀 Lanzar en Orquesta*.
            - **🌍 Enlace Global Anycast & Wi-Fi Local**:
              - Túnel Cloudflare Anycast TLS y auto-descubrimiento en GitHub Gist para conectar desde Perú a Japón o cualquier red móvil sin abrir puertos.
